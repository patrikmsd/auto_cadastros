<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assistente · conexão</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 0; width: 320px; color: #1b2233; background: #fff; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #e3e7f2; }
  header img { width: 20px; height: 20px; }
  header strong { flex: 1; font-size: 14px; }
  #ponto { width: 10px; height: 10px; border-radius: 50%; background: #b8bfd3; }
  #ponto.ok { background: #1f9d55; }
  #ponto.erro { background: #d33; }
  main { padding: 4px 14px 14px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #c5cbe0; border-radius: 6px; font: inherit; }
  small { display: block; margin-top: 3px; color: #5b6480; font-size: 11px; }
  button { width: 100%; margin-top: 12px; padding: 7px; border-radius: 6px; border: 1px solid #3157d5; background: #3157d5;
           color: #fff; cursor: pointer; font: inherit; font-weight: 600; }
  #estado { margin-top: 10px; padding: 7px 9px; border-radius: 6px; display: none; font-size: 12px; }
  #estado.ok { display: block; background: #e6f6ec; color: #11633a; }
  #estado.erro { display: block; background: #fdecec; color: #9b1c1c; }
</style>
</head>
<body>
  <header>
    <img src="icone.png" alt="">
    <strong>Assistente PowerCRM</strong>
    <span id="ponto" title="situação da conexão"></span>
  </header>
  <main>
    <label for="servidor">Servidor</label>
    <input id="servidor" placeholder="http://192.168.0.50:8780">
    <small>Endereço do servidor do assistente na rede.</small>

    <label for="chave">Sua chave</label>
    <input id="chave" type="password" placeholder="cole a chave que você recebeu">

    <button id="salvar">Conectar</button>
    <div id="estado"></div>
  </main>
  <script src="opcoes.js"></script>
</body>
</html>
